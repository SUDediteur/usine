name: Build site (prod + preview)

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.2'
          extended: true

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      # =========================
      # 📦 Clone engine ("usine")
      # =========================
      - name: Clone usine theme
        run: git clone https://github.com/SUDediteur/usine.git

      - name: Inject theme into build
        run: |
          mkdir -p themes layouts static

          cp -r usine/themes/* themes/
          cp -r usine/layouts/* layouts/
          cp -r usine/static/* static/
          cp usine/hugo.toml .

      # =========================
      # 🔧 Inject variables
      # =========================
      - name: Inject variables
        env:
          REPO: ${{ github.repository }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          envsubst < static/admin/config.yml > static/admin/config.yml.tmp
          mv static/admin/config.yml.tmp static/admin/config.yml

          envsubst < hugo.toml > hugo.tmp.toml
          mv hugo.tmp.toml hugo.toml

      # =========================
      # 🧱 Build Hugo
      # =========================
      - name: Build Hugo
        run: hugo

      # =========================
      # 🔥 Detect preview branch
      # =========================
      - name: Detect preview branch
        id: preview
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/cms/* ]]; then
            echo "is_preview=true" >> $GITHUB_OUTPUT
          else
            echo "is_preview=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # ☁️ Generate preview URL (temporaire)
      # =========================
      - name: Generate preview URL
        if: steps.preview.outputs.is_preview == 'true'
        run: |
          echo "PREVIEW_URL=https://apercu.sudediteur.workers.dev/${{ github.repository_owner }}/${GITHUB_SHA}" >> $GITHUB_ENV

      # =========================
      # 🔗 Publish GitHub status (Decap CMS)
      # =========================
      - name: Publish preview status
        if: steps.preview.outputs.is_preview == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            -X POST \
            repos/${{ github.repository }}/statuses/${GITHUB_SHA} \
            -f state=success \
            -f context=deploy-preview \
            -f target_url="$PREVIEW_URL"

      # =========================
      # 📦 Upload artifact (prod only)
      # =========================
      - name: Upload Pages artifact
        if: steps.preview.outputs.is_preview != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # =========================
  # 🌍 Deploy GitHub Pages (prod only)
  # =========================
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4