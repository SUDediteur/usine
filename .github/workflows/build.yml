name: Build site (prod + preview)

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.2'
          extended: true

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Clone usine theme
        run: git clone https://github.com/SUDediteur/usine.git

      - name: Inject theme into build
        run: |
          mkdir -p themes layouts static

          cp -r usine/themes/* themes/
          cp -r usine/layouts/* layouts/
          cp -r usine/static/* static/
          cp usine/hugo.toml .

      - name: Inject variables
        env:
          REPO: ${{ github.repository }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          envsubst < static/admin/config.yml > static/admin/config.yml.tmp
          mv static/admin/config.yml.tmp static/admin/config.yml

          envsubst < hugo.toml > hugo.tmp.toml
          mv hugo.tmp.toml hugo.toml

      - name: Build Hugo
        run: hugo


      - name: Upload preview to R2
          env:
            R2_ENDPOINT: ${{ secrets.CF_R2_ENDPOINT }}
          run: |
            USER=${{ github.repository_owner }}
            SHA=${GITHUB_SHA}

            aws s3 sync ./public \
              s3://preview-sites/${USER}/${SHA} \
              --endpoint-url $R2_ENDPOINT

      # =========================
      # 🔥 PREVIEW DETECTION
      # =========================
      - name: Detect preview branch
        id: preview
        run: |
          if [[ "${GITHUB_REF}" == refs/heads/cms/* ]]; then
            echo "is_preview=true" >> $GITHUB_OUTPUT
          else
            echo "is_preview=false" >> $GITHUB_OUTPUT
          fi

      # =========================
      # ☁️ PREVIEW URL (TEMPORAIRE)
      # =========================
      - name: Generate preview URL
        if: steps.preview.outputs.is_preview == 'true'
        run: |
          echo "PREVIEW_URL=https://apercu.sudediteur.workers.dev/${USER}/${GITHUB_SHA}" >> $GITHUB_ENV

      # =========================
      # 🔗 GITHUB STATUS (clé Decap CMS)
      # =========================
      - name: Publish preview status
        if: steps.preview.outputs.is_preview == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -d "{
              \"state\": \"success\",
              \"context\": \"deploy-preview\",
              \"target_url\": \"${PREVIEW_URL}\"
            }"

      # =========================
      # 📦 PROD DEPLOY (optionnel ici)
      # =========================
      - name: Upload Pages artifact
        if: steps.preview.outputs.is_preview != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4