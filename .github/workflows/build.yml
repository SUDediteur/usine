name: Construction du site web

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.140.2'
          extended: true

      - name: Installation du paquet gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Copie des fichiers du projet usine
        run: git clone https://github.com/SUDediteur/usine.git

      - name: Injection des fichiers du projet usine
        run: |
          mkdir -p themes layouts static

          cp -r usine/themes/* themes/
          cp -r usine/layouts/* layouts/
          cp -r usine/static/* static/
          cp usine/hugo.toml .

      - name: Injection des variables dynamiques
        env:
          REPO: ${{ github.repository }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          envsubst < static/admin/config.yml > static/admin/config.tmp.yml
          mv static/admin/config.tmp.yml static/admin/config.yml

          envsubst < hugo.toml > hugo.tmp.toml
          mv hugo.tmp.toml hugo.toml

      - name: Génération du site web par Hugo
        run: hugo

      - name: Mise en ligne du site web généré
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public


  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4