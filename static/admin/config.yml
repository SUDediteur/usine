backend:
  name: github
  repo: SUDediteur/vitrine
  branch: main
  
site_url: https://sudediteur.github.io/vitrine

media_folder: static/fichiers
public_folder: /fichiers

collections:
  - name: 'posts'
    label: 'Articles'
    folder: 'content/posts'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: true
    media_folder: "/static/fichiers/articles/{{slug}}"
    public_folder: "/fichiers/articles/{{slug}}"
    fields:
      - { label: 'Titre', name: 'title', widget: 'string' }
      - { label: 'Date de publication', name: 'date', widget: 'datetime' }
      - { label: 'Contenu', name: 'body', widget: 'markdown' }
  - name: 'page'
    label: 'Pages'
    folder: 'content/page'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: true
    media_folder: "/static/fichiers/pages/{{slug}}"
    public_folder: "/fichiers/pages/{{slug}}"
    fields:
      - { label: 'Titre', name: 'title', widget: 'string' }
      - { label: 'Date de publication', name: 'date', widget: 'datetime' }
      - { label: 'Contenu', name: 'body', widget: 'markdown' }

locale: fr

publish_mode: editorial_workflow

site_url: ${PAGES_URL}

logo:
  src: ${PAGES_URL}/img/logo_solidaires_carre.svg
  show_in_header: true